version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    # New releases wait a week before a PR is opened (supply-chain safety).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # New releases wait a week before a PR is opened (supply-chain safety).
    cooldown:
      default-days: 7
