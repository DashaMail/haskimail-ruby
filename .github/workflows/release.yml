name: Release

# Publishes to RubyGems when a version tag (v1.2.3) is pushed.
# Uses RubyGems trusted publishing — no API key is stored in the repository.
#
# Hardening: tests run in a separate job without publishing rights; no
# dependency cache is restored; lint tools are not installed; the tag must
# point at a commit on main; actions are pinned to commit SHAs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time; a running release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_WITHOUT: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
          bundler-cache: false
      - name: Tag matches the gem version
        run: test "v$(ruby -Ilib -e 'require "haskimail/version"; print Haskimail::VERSION')" = "$GITHUB_REF_NAME"
      - run: bundle install
      - run: bundle exec rake coverage

  release:
    name: Publish to RubyGems
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # `rake release` pushes the version tag
      id-token: write # RubyGems trusted publishing
    env:
      BUNDLE_WITHOUT: lint
    steps:
      # release-gem pushes the tag with its own token (as in its README).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
          bundler-cache: false
      - run: bundle install
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
